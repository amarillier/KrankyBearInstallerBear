# Example InstallerBear project file.
#
# This is a real, working installerbear.yaml — the exact one used to build
# KrankyBear InstallerBear's own installers — kept here as a bundled sample
# so "File > New Sample Project..." has a genuine, fully-featured example to
# start from instead of a blank project. Every section below is real and
# builds cleanly; adapt the identity/paths/GUID for your own application
# rather than using them as-is (windows.upgrade_guid especially — generate
# your own via the Identity tab's "Generate GUID" button, never reuse this
# one).
identity:
    name: KrankyBearInstallerBear
    id: com.github.amarillier.KrankyBearInstallerBear
    version: 0.7.0
    publisher: Allan Marillier, 2026-
    vendor: Allan Marillier
    url: https://github.com/amarillier/KrankyBearInstallerBear
    description: KrankyBear InstallerBear - Cross-platform Fyne installer / packager application
    license: GPL v3
    license_file: LICENSE
    icons:
        ico: assets/images/KrankyBearInstallerBear.ico
        icns: assets/images/KrankyBearInstallerBear.icns
        png: assets/images/KrankyBearInstallerBear.png
binaries:
    - os: windows
      arch: amd64
      path: bin/KrankyBearInstallerBear.exe
    - os: darwin
      arch: amd64
      path: bin/krankybear-installerbear-macos-amd64
    - os: darwin
      arch: arm64
      path: bin/krankybear-installerbear-macos-arm64
    - os: linux
      arch: amd64
      path: bin/krankybear-installerbear-linux-amd64
    - os: linux
      arch: arm64
      path: bin/krankybear-installerbear-linux-arm64
payload:
    - source: assets/i18n
      dest: assets/i18n
      recursive: true
    - source: assets/mesa-win/opengl32.dll
      dest: mesa-fallback
      os:
        - windows
    - source: assets/mesa-win/libgallium_wgl.dll
      dest: mesa-fallback
      os:
        - windows
    - source: assets/mesa-win/.force-mesa-fallback.sample
      dest: mesa-fallback
      os:
        - windows
    # NOTE always set dest empty for files in the app directory, do not use file name as dest, dest is directory relative to the install location
    - source: installerbear.yaml
      dest: ""
    - source: sample-installerbear.yaml
      dest: ""
    # Alternative to the two explicit .yaml entries above: source can be a
    # glob pattern instead of a literal path, so one entry can bundle
    # every .yaml file in the project directory without listing each one
    # by hand - handy once you have more than a couple. excludes filters
    # out specific matches you don't want swept up along with the rest.
    # Commented out here since having both this AND the two explicit
    # entries above active at once would try to install
    # installerbear.yaml/sample-installerbear.yaml twice each, colliding
    # as a duplicate destination - pick one approach or the other, not
    # both at the same time.
    # - source: "*.yaml"
    #   dest: ""
    #   excludes:
    #     - sample-installerbear.yaml
    - source: ReleaseNotes.md
      dest: ""
install:
    windows: $PROGRAMFILES64\KrankyBearInstallerBear
    macos: /Applications/KrankyBearInstallerBear.app
    linux: /opt/KrankyBearInstallerBear
install_experience:
    launch_after_install: true
    desktop_shortcut: true
windows:
    upgrade_guid: '{55F17CC0-57CC-43E9-A0A4-84C4AAECADE8}'
    exe_name: KrankyBearInstallerBear.exe
    install_scope: all_users
macos:
    bundle_executable: KrankyBearInstallerBear
targets:
    - deb
    - rpm
    - macpkg
    - winexe
    - winmsi
output:
    dir: ./installers
    filename_template: '{{.Identity.Name}}_{{.Identity.Version}}_{{.Arch}}'
    clean_old_versions: true
